<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="path/to/font-awesome/css/font-awesome.min.css">
    <title>Nuwara-Eliya General Hospital - Contact Us</title>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <img src="img/hospital_logo.png" alt="Hospital Logo">
        </div>
        <div class="hospital-info">
            <h1>Nuwara-Eliya General Hospital</h1>
            <p>Healing with Heart, Caring with Expertise.</p>
        </div>

        <!-- Top Navigation: Search Bar, Sign In, Sign Up -->
        <div class="top-navigation">
            <div class="search-bar">
                <input type="text" placeholder="Search...">
                <button><i class="fas fa-search"></i></button>
            </div>                        

            <div class="user-buttons">
                <button class="sign-in-btn" onclick="navigateTosignin()">Sign In</button>
            </div>
        </div>
    </header>

    <!-- Navigation Links -->
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="staff.html">Staff</a></li>
            <li><a href="news.html">News and Events</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="contact.html">Contact Us</a></li>
            <li><a href="donate.html">Donate</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
        <main class="cont">

        <h2>Sign in</h2>
            <!-- signup Form -->
            <section class="contact-form">
                <div class="form-group">
                    <form class="signup-form">
                        <h2 class="signup-heading">Hospital Sign Up</h2>
                        <label for="fullname" class="form-label">Full Name:</label>
                        <input type="text" id="fullname" name="fullname" class="form-input" required>
            
                        <label for="username" class="form-label">Username:</label>
                        <input type="text" id="username" name="username" class="form-input" required>
            
                        <label for="email" class="form-label">Email:</label>
                        <input type="email" id="email" name="email" class="form-input" required>
            
                        <label for="password" class="form-label">Password:</label>
                        <input type="password" id="password" name="password" class="form-input" required>
            
                        <button type="submit" class="submit-btn">Sign Up</button>
                    </form>
                </div>
            </section>
            
        </main>
    <!-- Footer -->
    <footer>
        <p>&copy; 2024 Nuwara-Eliya General Hospital. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
